<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Snake</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #0f172a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #f1f5f9;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 12px 24px;
  touch-action: manipulation;
  overflow: hidden;
}

.top-bar {
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.back-link {
  color: #94a3b8;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 0;
}

.score {
  font-size: 18px;
  font-weight: 600;
  color: #22c55e;
}

#gameCanvas {
  display: block;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 1;
  border-radius: 12px;
  background: #1e293b;
  border: 2px solid #334155;
  touch-action: none;
}

.controls {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, 64px);
  grid-template-rows: repeat(3, 64px);
  gap: 6px;
  justify-content: center;
}

.ctrl-btn {
  width: 64px;
  height: 64px;
  border: none;
  border-radius: 12px;
  background: #334155;
  color: #f1f5f9;
  font-size: 22px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.ctrl-btn:active { background: #475569; }
.ctrl-btn.empty { visibility: hidden; pointer-events: none; }

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 20px;
}

.overlay.hidden { display: none; }

.overlay h2 {
  font-size: 28px;
  margin-bottom: 8px;
}

.overlay p {
  color: #94a3b8;
  margin-bottom: 20px;
  text-align: center;
}

.overlay button {
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: #0f172a;
  cursor: pointer;
}

.overlay button:active { background: #16a34a; }

.hint {
  margin-top: 12px;
  font-size: 12px;
  color: #64748b;
  text-align: center;
}
</style>
</head>
<body>
<div class="top-bar">
  <a class="back-link" href="/games">← Games</a>
  <span class="score">Score: <span id="score">0</span></span>
</div>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<div class="controls">
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="up">▲</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="left">◀</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="right">▶</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="down">▼</button>
  <div class="ctrl-btn empty"></div>
</div>

<p class="hint">Swipe on the board or use the buttons below</p>

<div class="overlay" id="startOverlay">
  <h2>Snake</h2>
  <p>Eat the food, grow longer, don't hit the walls or yourself.</p>
  <button id="startBtn">Play</button>
</div>

<div class="overlay hidden" id="gameOverOverlay">
  <h2>Game Over</h2>
  <p>Score: <span id="finalScore">0</span></p>
  <button id="restartBtn">Play Again</button>
</div>

<script>
(function () {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const finalScoreEl = document.getElementById("finalScore");
  const startOverlay = document.getElementById("startOverlay");
  const gameOverOverlay = document.getElementById("gameOverOverlay");

  const GRID = 20;
  const CELL = canvas.width / GRID;

  let snake, direction, nextDirection, food, score, running, loopId;

  function resetGame() {
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    food = spawnFood();
    score = 0;
    scoreEl.textContent = "0";
    running = true;
  }

  function spawnFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    return pos;
  }

  function setDirection(x, y) {
    if (!running) return;
    if (x === -direction.x && y === -direction.y) return;
    nextDirection = { x, y };
  }

  function draw() {
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(
      food.x * CELL + CELL / 2,
      food.y * CELL + CELL / 2,
      CELL / 2 - 2,
      0,
      Math.PI * 2
    );
    ctx.fill();

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? "#22c55e" : "#16a34a";
      ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function tick() {
    if (!running) return;

    direction = nextDirection;
    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y,
    };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      endGame();
      return;
    }

    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      food = spawnFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame() {
    running = false;
    clearInterval(loopId);
    finalScoreEl.textContent = score;
    gameOverOverlay.classList.remove("hidden");
  }

  function startGame() {
    startOverlay.classList.add("hidden");
    gameOverOverlay.classList.add("hidden");
    resetGame();
    draw();
    clearInterval(loopId);
    loopId = setInterval(tick, 120);
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", startGame);

  document.querySelectorAll(".ctrl-btn[data-dir]").forEach(btn => {
    btn.addEventListener("click", () => {
      const d = btn.dataset.dir;
      if (d === "up") setDirection(0, -1);
      if (d === "down") setDirection(0, 1);
      if (d === "left") setDirection(-1, 0);
      if (d === "right") setDirection(1, 0);
    });
  });

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: false });

  canvas.addEventListener("touchend", e => {
    e.preventDefault();
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
  }, { passive: false });

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") setDirection(0, -1);
    if (e.key === "ArrowDown") setDirection(0, 1);
    if (e.key === "ArrowLeft") setDirection(-1, 0);
    if (e.key === "ArrowRight") setDirection(1, 0);
  });
})();
</script>
</body>
</html>
