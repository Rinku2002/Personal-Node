<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PC Files</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; padding: 0; margin: 0; color: #2d3748; background-color: #ffffff; }
        a { text-decoration: none; word-break: break-all; }
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a202c;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Top Bar Options Menu Dropdown */
        .menu-dropdown { position: relative; display: inline-block; }
        .menu-dropdown summary {
            list-style: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            user-select: none;
            color: #4a5568;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease;
        }
        .menu-dropdown summary::-webkit-details-marker { display: none; }
        .menu-dropdown summary:hover { background-color: #edf2f7; }

        .menu-content {
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 6px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            z-index: 100;
            min-width: 170px;
            padding: 6px 0;
        }

        .menu-content button, .menu-content a {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 16px;
            background: none;
            border: none;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: #4a5568;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .menu-content button:hover, .menu-content a:hover {
            background-color: #f7fafc;
            color: #1a202c;
        }

        .menu-content a.danger:hover {
            background-color: #fff5f5;
            color: #e53e3e;
        }

        .icon-svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* Modal Dialog Styling */
        dialog {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 24px;
            max-width: 420px;
            width: 90%;
        }
        dialog::backdrop { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(2px); }
        
        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-cancel {
            padding: 8px 16px;
            background-color: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-cancel:hover { background-color: #e2e8f0; }
        .btn-submit {
            padding: 8px 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-submit:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="toolbar">
        <h2 class="brand-title">
            <svg class="icon-svg" style="width:24px; height:24px; stroke:#2563eb;" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            My PC Files
        </h2>

        <!-- Header 3-Dots Menu -->
        <details class="menu-dropdown">
            <summary title="Options">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
            </summary>
            <div class="menu-content">
                <button onclick="document.getElementById('uploadModal').showModal(); this.closest('details').removeAttribute('open');">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Upload File
                </button>
                <button onclick="document.getElementById('mkdirModal').showModal(); this.closest('details').removeAttribute('open');">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
                    Create Folder
                </button>
                <div style="border-top: 1px solid #f1f5f9; margin: 4px 0;"></div>
                <a href="/logout" class="danger" style="color: #ef4444;">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Log out
                </a>
            </div>
        </details>
    </div>

    <!-- Main File Browser Area -->
    <div style="padding: 0 24px;">
        {{back_link}}
        {{file_list}}
    </div>

    <!-- Upload File Modal Form -->
    <dialog id="uploadModal">
        <div class="modal-header">
            <svg class="icon-svg" style="stroke:#2563eb;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            Upload File
        </div>
        <form action="{{upload_path}}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required style="font-size: 14px; width: 100%; margin-bottom: 12px; padding: 8px; border: 1px dashed #cbd5e1; border-radius: 6px;">
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="document.getElementById('uploadModal').close()">Cancel</button>
                <button type="submit" class="btn-submit">Upload</button>
            </div>
        </form>
    </dialog>

    <!-- Create Folder Modal Form -->
    <dialog id="mkdirModal">
        <div class="modal-header">
            <svg class="icon-svg" style="stroke:#2563eb;" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
            Create New Folder
        </div>
        <form action="{{mkdir_path}}" method="post">
            <input type="text" name="foldername" placeholder="Folder name..." required style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; outline: none;">
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="document.getElementById('mkdirModal').close()">Cancel</button>
                <button type="submit" class="btn-submit">Create</button>
            </div>
        </form>
    </dialog>

</body>
</html>
