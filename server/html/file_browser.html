<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My PC Files</title>
<style>
body { font-family: Arial, sans-serif; font-size: 18px; padding: 20px; }
a { text-decoration: none; line-height: 35px; word-break: break-all; }
.toolbar { margin-bottom: 16px; }
</style>
</head>
<body>
<h2>My PC Files</h2>
<div class="toolbar">
    <a href="/logout">Log out</a>
</div>
<form action="{{upload_path}}" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button type="submit">Upload</button>
</form>
<br>
{{back_link}}
{{file_list}}
</body>
</html>
