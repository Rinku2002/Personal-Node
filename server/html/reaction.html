<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Reaction Tap</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  touch-action: manipulation; overflow: hidden;
}
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between; padding: 12px 16px;
}
.back-link { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; }
.best { color: rgba(255,255,255,0.7); font-size: 14px; }
#tapArea {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none;
  transition: background 0.2s;
}
#tapArea.waiting { background: #ef4444; }
#tapArea.ready { background: #22c55e; }
#tapArea.tooSoon { background: #f59e0b; }
#tapArea.idle { background: #1e293b; }
.msg { font-size: 22px; font-weight: 700; color: white; text-align: center; padding: 0 24px; }
.time { font-size: 48px; font-weight: 800; color: white; margin-top: 12px; }
</style>
</head>
<body>
<div class="top-bar">
  <a class="back-link" href="/games">← Games</a>
  <span class="best">Best: <span id="best">—</span> ms</span>
</div>

<div id="tapArea" class="idle">
  <p class="msg" id="msg">Tap to start</p>
  <p class="time" id="time"></p>
</div>

<script>
(function () {
  const area = document.getElementById("tapArea");
  const msg = document.getElementById("msg");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  let state = "idle", startTime, timeoutId;
  let best = localStorage.getItem("reactionBest");
  if (best) bestEl.textContent = best;

  function reset() {
    clearTimeout(timeoutId);
    state = "idle";
    area.className = "idle";
    msg.textContent = "Tap to start";
    timeEl.textContent = "";
  }

  function handleTap() {
    if (state === "idle") {
      state = "waiting";
      area.className = "waiting";
      msg.textContent = "Wait for green...";
      timeEl.textContent = "";
      const delay = 1500 + Math.random() * 3000;
      timeoutId = setTimeout(() => {
        state = "ready";
        area.className = "ready";
        msg.textContent = "TAP NOW!";
        startTime = performance.now();
      }, delay);
    } else if (state === "waiting") {
      clearTimeout(timeoutId);
      state = "tooSoon";
      area.className = "tooSoon";
      msg.textContent = "Too soon! Tap to retry";
      timeEl.textContent = "";
      setTimeout(() => reset(), 1500);
    } else if (state === "ready") {
      const ms = Math.round(performance.now() - startTime);
      state = "idle";
      area.className = "idle";
      msg.textContent = "Tap to try again";
      timeEl.textContent = ms + " ms";
      if (!best || ms < parseInt(best)) {
        best = String(ms);
        localStorage.setItem("reactionBest", best);
        bestEl.textContent = best;
      }
    }
  }

  area.addEventListener("click", handleTap);
  area.addEventListener("touchend", e => { e.preventDefault(); handleTap(); });
})();
</script>
</body>
</html>
